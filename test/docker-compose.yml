
services:

  web:
    build: .
    container_name: lamp_webserver
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./www:/var/www/html
      - ./conf/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: lamp_database
    restart: always
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: lamp_phpmyadmin
    restart: always
    ports:
      - "${PMA_PORT}:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data:
